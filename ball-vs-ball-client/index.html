<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ball vs Ball</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Michroma&family=Source+Sans+3:wght@400;700;800&family=Nunito:wght@800;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- Bloxity Legion SDK (pinned v1). The game also runs without it, e.g. in a local preview. -->
    <script src="https://sdk.bloxity.io/v1/legion-sdk.min.js" defer></script>
    <!-- Plain-HTML loading screen: paints before any script arrives; src/ui/screens/loadingScreen.js moves its
         bar and fades it out once the world is built. -->
    <style>
      #loading-screen {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: radial-gradient(ellipse at 50% 35%, #4d9ef0, #1d5fb4 60%, #123f82);
        font-family: "Righteous", "Arial Black", sans-serif; color: #fff; transition: opacity 0.4s ease;
        --progress: 0.06;
      }
      #loading-screen.done { opacity: 0; pointer-events: none; }
      #loading-screen .title {
        margin: 0; font-size: clamp(40px, 8vw, 96px); font-weight: 400; letter-spacing: 0.02em;
        -webkit-text-stroke: clamp(6px, 1vw, 12px) #12203f; paint-order: stroke fill;
        text-shadow: 0 6px 0 #12203f;
      }
      #loading-screen .title b { color: #ff6b6b; font-weight: 400; }
      #loading-screen .bar {
        width: min(80vw, 520px); height: 22px; margin: 28px auto 0; padding: 4px; box-sizing: border-box;
        border: 3px solid #12203f; border-radius: 999px; background: #e9f2ff;
      }
      #loading-screen .fill {
        width: calc(var(--progress) * 100%); height: 100%; border-radius: 999px;
        background: linear-gradient(#8ff0ff, #2a8cff); transition: width 0.3s ease;
      }
      #loading-screen .status { margin-top: 14px; text-align: center; font-size: 18px; -webkit-text-stroke: 4px #12203f; paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="loading-screen" role="status" aria-label="Loading Ball vs Ball">
      <div>
        <h1 class="title">Ball <b>vs</b> Ball</h1>
        <div class="bar"><div class="fill"></div></div>
        <div class="status">Starting up</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
